<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample app</title>
  <style>body{font:16px system-ui;margin:40px} nav a{margin-right:12px} .toolbar button{margin-right:8px}</style>
</head>
<body>
  <nav><a href="#home">Home</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
  <h1>Sample app</h1>
  <div class="toolbar">
    <button type="button">Save</button>
    <button type="button">Share</button>
    <button type="button">Delete</button>
  </div>
  <div id="late"></div>
  <script>
    // Rendered after load, like an SPA, to exercise the Mover's rescan.
    setTimeout(function () {
      var b = document.createElement('button');
      b.textContent = 'Late button';
      document.getElementById('late').appendChild(b);
    }, 50);
  </script>
</body>
</html>
