manifest_version: 1
id: test.ops
version: 1.0.0
description: TEST FIXTURE - long-running handler that starts a background process, for timeout and cancellation tests.
requirement: CAP-40
handlers: {execute: handler:noop, healthcheck: handler:healthcheck, verify: handler:verify_any}
input_schema: {type: object}
output_schema: {type: object}
permissions: [workspace.write]
risk: low
dependencies: {capabilities: [], services: [], python: []}
timeout_s: 30
enabled: true
tools:
  - {name: sleep_and_mark, description: Start a detached process that writes a marker file later then sleep., task_types: [ops.test],
     operations: [run], handler: "handler:sleep_and_mark", verify: "handler:verify_any", path_arguments: [marker],
     input_schema: {type: object, additionalProperties: false, required: [marker, delay, sleep], properties: {marker: {type: string}, delay: {type: number}, sleep: {type: number}}},
     output_schema: {type: object}, permissions: [workspace.write], risk: low, timeout_s: 2, cancellable: true, idempotency: non_idempotent}
  - {name: noop, description: Return immediately with ok true (harmless)., task_types: [ops.test],
     operations: [noop], handler: "handler:noop", verify: "handler:verify_any",
     input_schema: {type: object, additionalProperties: false, properties: {n: {type: integer}}},
     output_schema: {type: object, required: [ok], properties: {ok: {type: boolean}, n: {type: integer}}},
     permissions: [workspace.write], risk: low, timeout_s: 10, cancellable: true, idempotency: idempotent}
  - {name: record_url, description: Record a URL argument without contacting it (drift-guard destination tests)., task_types: [ops.test],
     operations: [fetch], handler: "handler:record_url", verify: "handler:verify_any", url_arguments: [url],
     input_schema: {type: object, additionalProperties: false, required: [url], properties: {url: {type: string}}},
     output_schema: {type: object, required: [recorded], properties: {recorded: {type: string}}},
     permissions: [workspace.write], risk: low, timeout_s: 5, cancellable: true, idempotency: idempotent}
