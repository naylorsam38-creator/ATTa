# LOCAL_NVIDIA — workstation with an NVIDIA GPU. Limits are further derived from detected VRAM by the resolver.
deployment:
  runtime_preference: [llamacpp, ollama, vllm]
  model_context_tokens: 8192
  gpu_visible_to_workers: false        # tool workers never see the GPU; only the model runtime does
  controller_caps: {max_concurrent_tools_per_task: 2}
workers:
  max_concurrency: 4
  memory_limit_mb: 2048
