# System dependency manifest (Stage 01B §11). Versions are minimums/pins checked by `backend.deployment deps`.
python: {min: "3.12", max_exclusive: "3.14", lock: configuration/locks/backend-core.lock.txt}
node: {min: "20.9.0", lock: package-lock.json, mobile_lock: apps/mobile/package-lock.json}
git: {min: "2.30"}
postgresql: {major: 16, extensions: {vector: ">=0.6"}}
redis: {min: "7.0"}
nvidia_driver: {min_for: {LOCAL_NVIDIA: "535", H100: "535"}}
cuda: {min_for: {H100: "12.1"}}
container_images:              # tags are pinned; digests are BLOCKED until resolved on a host with registry access
  - {image: pgvector/pgvector, tag: 0.8.1-pg16, digest: null}
  - {image: redis, tag: 7.4-alpine, digest: null}
  - {image: minio/minio, tag: RELEASE.2025-09-07T16-13-09Z, digest: null}
  - {image: temporalio/temporal, tag: 1.5.1, digest: null}
  - {image: python, tag: 3.13-slim-bookworm, digest: null}
# Offline bundle system packages (Stage 01B §12). Debian/Ubuntu: the dependency closure is downloaded as .deb files
# (base-system packages of priority required/important are assumed present). Windows: operator-provided installers.
offline_system_packages:
  debian: [postgresql-16, postgresql-client-16, postgresql-16-pgvector, redis-server, git]
  windows:
    # PostgreSQL 16 x64 binaries (EDB builds repackaged on the npm registry; npm verifies the sha512 integrity)
    postgresql_npm: "@embedded-postgres/windows-x64@16.15.0-beta.19"
    # No redistributable Windows build is reachable from the build machine for these; the operator supplies the
    # installers (bundle create --target windows --windows-installers DIR/<name>/...) and they are hashed into the
    # bundle manifest. Without them the bundle reports them BLOCKED.
    operator_supplied:
      pgvector: {expected: "pgvector 0.6+ built for PostgreSQL 16 x64 (vector.dll, vector.control, vector--*.sql)",
                 reason: "pgvector publishes no Windows binaries; build with MSVC (nmake /F Makefile.win) or use WSL/Docker"}
      redis: {expected: "Memurai Developer or a Redis 7 for Windows build (MSI or ZIP)",
              reason: "no Windows Redis build is available from the registries reachable here (memurai.com blocked)"}
      git: {expected: "Git for Windows 64-bit installer (needed only for build-controller gates and updates)",
            reason: "Git for Windows is distributed from github.com release assets, not reachable from this build machine"}
# Third-party imports deliberately NOT locked (checked by `deps --check`): only Internet-dependent optional features
# guarded by ImportError, reported OFFLINE_UNAVAILABLE. Any other unlocked import fails the dependency check.
unlocked_optional_imports:
  anthropic: "legacy ATTa optional LLM repair (04-deployment/llm_repair.py): needs Internet + API key; guarded, OFFLINE_UNAVAILABLE"
