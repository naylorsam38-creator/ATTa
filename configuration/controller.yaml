# Runtime intelligence controller — TRUSTED operator configuration (Stage 01A §13). Neither the LLM nor a worker
# can change these values: task contracts may only request limits at or below them.
limits:
  max_active_tasks_per_objective: 4     # Focus-4
  max_tools_per_task: 4
  max_actions_per_task: 30
  max_retries_per_step: 2
  max_failed_steps_per_task: 3
  max_concurrent_tools_per_task: 2
  max_task_duration_s: 1800
  max_proposal_corrections: 2           # bounded correction attempts for malformed proposals
  max_repairs_per_task: 2               # bounded repair after failed verification
  no_progress_window: 3                 # identical outcomes in a row = no measurable progress
default_resource_budget:
  tokens: 200000
  cpu_seconds: 600
  memory_mb: 1024
  disk_mb: 256
  network_requests: 0
  external_api_calls: 0
  spend_cents: 0
# Trusted exceptions to max_tools_per_task, by task type (keep empty unless a task genuinely cannot be split).
tool_limit_exceptions: {}
# Context assembly: used when a model adapter does not report its own capacity.
default_model_context_tokens: 8192
# Controller operator-approval public key (objective approval, amendments, re-attempts after cancellation).
operator_public_key: configuration/controller_operator_ed25519.pub
# Paths a task may never touch, whatever its contract says (verification system and acceptance criteria).
protected_path_prefixes: ["configuration/build", "tests/acceptance", "backend/verification", "evidence"]
