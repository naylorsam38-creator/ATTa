# ArchiveBox — deploy bundle. Coolify: "Docker Compose" build pack, this file.
# Public entrypoint is `proxy` (the capability proxy); it forwards to `archivebox` and injects the Port.
services:
  proxy:
    build: ./capability
    environment:
      - SERVICE_URL_PROXY_8080
      - APP_ID=${ATTA_APP_ID}
      - TARGET=http://archivebox:8000
    depends_on:
      - archivebox
    restart: unless-stopped

  archivebox:
    build:
      context: ./app
      dockerfile: Dockerfile.atta
    environment:
      - ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=${SERVICE_URL_PROXY:-http://localhost:8080}
      - PUBLIC_INDEX=${PUBLIC_INDEX:-False}
    volumes:
      - archivebox-data:/data
    restart: unless-stopped

volumes:
  archivebox-data:
