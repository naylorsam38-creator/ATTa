# v116: written by bootstrap.sh from this template; __LISTEN__ and YOUR_DOMAIN are filled in there.
#   __LISTEN__ = 127.0.0.1:80 until HTTPS is set up (reach it with: ssh -L 8080:127.0.0.1:80 <server>),
#                80 when a domain + certificate email are set (certbot then adds 443 and the redirect),
#                80 without a certificate only if APP_BUILDER_ALLOW_PUBLIC_HTTP=true (logins in clear text).
# Per-address limits: login attempts and uploads are rate-limited here as well as in the gateway.
limit_req_zone  $binary_remote_addr zone=atta_login:10m  rate=10r/m;
limit_req_zone  $binary_remote_addr zone=atta_upload:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=atta_conn:10m;

server {
  listen __LISTEN__;
  server_name YOUR_DOMAIN;
  server_tokens off;
  client_max_body_size 10G;
  client_body_timeout 120s;
  limit_conn atta_conn 20;
  limit_req_status 429;
  limit_conn_status 429;
  # Browsers ignore this over plain HTTP; once certbot adds HTTPS to this server it pins it there.
  add_header Strict-Transport-Security "max-age=31536000" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Authenticated-Customer-Id "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  location = /login {
    limit_req zone=atta_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8787;
  }
  location = /upload {
    limit_req zone=atta_upload burst=3 nodelay;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8787;
  }
  location / {
    proxy_pass http://127.0.0.1:8787;
  }
}
