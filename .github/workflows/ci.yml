# ATTa CI — every pull request and every push to main.
#
#   static      shellcheck, every .py compiles, the release builds twice to the same bytes (tools/make_release.py)
#   unit        the test suite on Python 3.9 (the oldest supported) and 3.12, as a normal user and as root.
#               These are development pre-checks: they use stand-ins (a scripted installer, a small systemd
#               stand-in) and never count toward certifying a release.
#   server      the REAL thing on a fresh Ubuntu 24.04 machine: the release zip is installed with `sudo bash run`
#               (real systemd, nginx, Docker, Chromium), then tests/staging/ec2_acceptance.sh and
#               tests/staging/server_lifecycle.sh run against it: deploy, one-at-a-time, a killed deploy, a time
#               limit, rollback. Nothing in it is simulated.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: shellcheck (installer, library, run, staging scripts)
        working-directory: ATTa/04-deployment
        run: |
          shellcheck -S info -x bootstrap.sh bootstrap-lib.sh
          shellcheck -S warning ../run ../tests/staging/server_lifecycle.sh
      - name: every Python file compiles (3.9 syntax floor checked by the unit job)
        run: python3 -m compileall -q -x '/(\.git|__pycache__)/' ATTa tools
      - name: the release builds, is checked, and is reproducible
        run: |
          python3 tools/make_release.py --out dist1
          python3 tools/make_release.py --out dist2
          cmp dist1/*.zip dist2/*.zip
          cat dist1/*.sha256

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
        user: [runner, root]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: system tools the tests use for real (nginx, openssl, shellcheck)
        run: sudo apt-get update -q && sudo apt-get install -y -q nginx-light openssl shellcheck
      - name: Python packages
        run: python -m pip install -q pyyaml
      - name: test suite (${{ matrix.user }})
        working-directory: ATTa
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if [ "${{ matrix.user }}" = root ]; then
            sudo -E env "PATH=$PATH" python -m unittest discover -s tests
          else
            python -m unittest discover -s tests
          fi

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: static
    steps:
      - uses: actions/checkout@v4
      - name: build the release zip
        run: python3 tools/make_release.py --out dist
      - name: unpack it the way an operator does
        run: |
          mkdir -p "$RUNNER_TEMP/release" && cd "$RUNNER_TEMP/release"
          unzip -q "$GITHUB_WORKSPACE"/dist/ATTa-*.zip
          ls -la ATTa
      - name: install — sudo bash run
        working-directory: ${{ runner.temp }}/release/ATTa
        run: sudo bash run
      - name: security acceptance (tests/staging/ec2_acceptance.sh)
        working-directory: ${{ runner.temp }}/release/ATTa
        run: sudo bash tests/staging/ec2_acceptance.sh
      - name: deploy lifecycle (tests/staging/server_lifecycle.sh)
        working-directory: ${{ runner.temp }}/release/ATTa
        run: sudo bash tests/staging/server_lifecycle.sh "$GITHUB_WORKSPACE"/dist/ATTa-*.zip
      - name: collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          sudo cp -r /srv/app-builder/adm/logs "$RUNNER_TEMP/logs/adm" 2>/dev/null || true
          sudo journalctl --no-pager -u 'app-builder-*' -u atta-deployd -u nginx > "$RUNNER_TEMP/logs/journal.txt" 2>&1 || true
          sudo sh -c 'deployctl status; deployctl releases; deployctl jobs' > "$RUNNER_TEMP/logs/deployctl.txt" 2>&1 || true
          sudo chmod -R a+rX "$RUNNER_TEMP/logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-logs
          path: ${{ runner.temp }}/logs
