name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck bats dnsutils zip unzip
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
