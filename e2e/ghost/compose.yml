# Ghost: official image ghost:6 with MySQL 8 (Ghost's documented Docker setup); url set to the proxy address.
services:
  ghost:
    image: ghost:6
    restart: always
    ports: ["9109:2368"]
    environment:
      - url=http://127.0.0.1:9209
      - database__client=mysql
      - database__connection__host=mysql
      - database__connection__user=ghost
      - database__connection__password=ghost-pass
      - database__connection__database=ghost
      - NODE_ENV=production
      - server__host=0.0.0.0   # sandbox kernel has no IPv6; the image default "::" fails with EAFNOSUPPORT (Code -97)
    depends_on: {mysql: {condition: service_healthy}}
  mysql:
    image: mysql:8.0
    environment: [MYSQL_DATABASE=ghost, MYSQL_USER=ghost, MYSQL_PASSWORD=ghost-pass, MYSQL_ROOT_PASSWORD=root-pass]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, retries: 30}
